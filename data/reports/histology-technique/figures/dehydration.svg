<svg viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman" font-size="14">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <g id="beakers">
    <!-- 7 baths -->
    <g transform="translate(10,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#d7ecf9" stroke="#1f4e79" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">70°</text></g>
    <g transform="translate(98,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#c2e0f5" stroke="#1f4e79" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">80°</text></g>
    <g transform="translate(186,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#a9d3f0" stroke="#1f4e79" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">90°</text></g>
    <g transform="translate(274,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#8cc4ea" stroke="#1f4e79" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">95°</text></g>
    <g transform="translate(362,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#6cb1e2" stroke="#1f4e79" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">100°</text></g>
    <g transform="translate(450,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#fbe7c6" stroke="#8a5a00" stroke-width="2"/><text x="35" y="60" text-anchor="middle" font-weight="bold">Toluene</text></g>
    <g transform="translate(550,30)"><path d="M0,0 V90 Q0,100 10,100 H60 Q70,100 70,90 V0" fill="#f3e9a9" stroke="#8a5a00" stroke-width="2"/><text x="35" y="55" text-anchor="middle" font-weight="bold">Paraffin</text><text x="35" y="73" text-anchor="middle" font-size="12">(liquid)</text></g>
  </g>
  <path d="M15,18 H430" stroke="#1f4e79" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="12" text-anchor="middle" fill="#1f4e79" font-weight="bold">Ethanol of increasing concentration</text>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="220" y="155">① water is replaced by alcohol</text>
    <text x="485" y="155">② alcohol → toluene</text>
    <text x="585" y="175">③ toluene → paraffin</text>
  </g>
</svg>