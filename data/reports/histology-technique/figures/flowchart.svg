  <g text-anchor="middle" fill="#1a1a1a">
    <text x="105" y="46" font-weight="bold">1. Sampling</text><text x="105" y="66" font-size="13">(collection of material)</text>
    <text x="315" y="46" font-weight="bold">2. Fixation</text><text x="315" y="66" font-size="13">(stop autolysis)</text>
    <text x="530" y="46" font-weight="bold">3. Dehydration</text><text x="530" y="66" font-size="13">(alcohol → toluene)</text>
    <text x="105" y="161" font-weight="bold">4. Embedding</text><text x="105" y="181" font-size="13">(paraffin, 56–58 °C)</text>
    <text x="315" y="161" font-weight="bold">5. Sectioning</text><text x="315" y="181" font-size="13">(microtome, 2–5 µm)</text>
    <text x="530" y="161" font-weight="bold">6. Deparaffinization</text><text x="530" y="181" font-size="13">and rehydration</text>
    <text x="105" y="276" font-weight="bold">7. Staining</text><text x="105" y="296" font-size="13">(H&amp;E, HES, trichrome)</text>
    <text x="315" y="276" font-weight="bold">8. Mounting</text><text x="315" y="296" font-size="13">(Canada balsam)</text>
    <text x="530" y="276" font-weight="bold">9. Observation</text><text x="530" y="296" font-size="13">(light microscope)</text>
  </g>
</svg>