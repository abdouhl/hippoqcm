<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman" font-size="15">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker>
  </defs>
  <g stroke="#1f4e79" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M190,50 H228"/><path d="M400,50 H438"/>
    <path d="M530,78 V108 H110 V138"/>
    <path d="M190,165 H228"/><path d="M400,165 H438"/>
    <path d="M530,193 V223 H110 V253"/>
    <path d="M190,280 H228"/><path d="M400,280 H438"/>
  </g>
  <g stroke="#1f4e79" stroke-width="1.5">
    <rect x="20" y="22" width="170" height="56" rx="10" fill="#dbe7f3"/>
    <rect x="230" y="22" width="170" height="56" rx="10" fill="#f7d9db"/>
    <rect x="440" y="22" width="180" height="56" rx="10" fill="#dbe7f3"/>
    <rect x="20" y="137" width="170" height="56" rx="10" fill="#fdf0d5"/>
    <rect x="230" y="137" width="170" height="56" rx="10" fill="#dbe7f3"/>
    <rect x="440" y="137" width="180" height="56" rx="10" fill="#fdf0d5"/>
    <rect x="20" y="252" width="170" height="56" rx="10" fill="#efdcf2"/>
